name = "nep-tourna"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
ADMIN_EMAIL = "admin@neptourna.local"
ADMIN_PASSWORD = "admin@5678_9"
CORS_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "nep-tourna"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
